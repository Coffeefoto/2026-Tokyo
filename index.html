<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026東京好玩之旅 🤩🤩</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #fafaf9; 
            color: #292524;
        }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            height: 300px;
        }
        .tab-btn.active {
            background-color: #0d9488;
            color: white;
            border-color: #0d9488;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Illustration Style Cards */
        .illus-card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .illus-card:hover {
            transform: translateY(-5px);
            border-color: #0d9488;
            box-shadow: 0 10px 20px -5px rgba(13, 148, 136, 0.1);
        }
    </style>
</head>
<body class="antialiased selection:bg-teal-200 selection:text-teal-900">

    <header class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-2xl sm:text-3xl font-bold text-stone-800">🗼 2026東京好玩之旅 🤩🤩</h1>
            <div class="text-sm font-medium text-stone-500 bg-stone-100 px-3 py-1 rounded-full">
                📅 2026年6月4日 至 6月10日
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">

        <!-- 插畫風格概覽區塊 -->
        <section id="overview-section" class="space-y-8">
            <div class="text-center max-w-2xl mx-auto">
                <h2 class="text-3xl font-bold text-stone-800 mb-4">🍙🍥行程規劃概覽🍥🍙</h2>
                <p class="text-stone-600 leading-relaxed">
                    舒適的東京之旅
                </p>
            </div>

            <div class="bg-teal-900 text-white p-8 rounded-3xl shadow-xl flex flex-col md:flex-row items-center gap-8 overflow-hidden relative">
                <div class="absolute top-0 right-0 opacity-10 text-9xl transform translate-x-1/4 -translate-y-1/4">📝</div>
                <div class="z-10 flex-grow">
                    <h4 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <span>🚀</span> 預約清單 CHECKLIST
                    </h4>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="bg-teal-800/50 p-4 rounded-xl backdrop-blur-sm">
                            <span class="text-teal-300 text-xs font-bold uppercase tracking-widest block mb-1">博物館</span>
                            <p class="font-medium">藤子·F·不二雄博物館門票</p>
                        </div>
                        <div class="bg-teal-800/50 p-4 rounded-xl backdrop-blur-sm">
                            <span class="text-teal-300 text-xs font-bold uppercase tracking-widest block mb-1">交通</span>
                            <p class="font-medium">富士回遊特急車票(來回已訂)</p>
                        </div>
                        <div class="bg-teal-800/50 p-4 rounded-xl backdrop-blur-sm">
                            <span class="text-teal-300 text-xs font-bold uppercase tracking-widest block mb-1">交通</span>
                            <p class="font-medium">已Book車，(鐮倉自駕，河口湖自駕)</p>
                        </div>
                        <div class="bg-teal-800/50 p-4 rounded-xl backdrop-blur-sm">
                            <span class="text-teal-300 text-xs font-bold uppercase tracking-widest block mb-1">美食</span>
                            <p class="font-medium">熱門晚餐餐廳訂位</p>
                        </div>                        
                    </div>
                </div>
            </div>
        </section>

        <!-- 行程區塊 -->
        <section id="itinerary-section" class="space-y-6 pt-12 border-t border-stone-200">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-stone-800 mb-2">🗓️ 每日詳細行程</h2>
                <p class="text-stone-600 leading-relaxed">
                    點擊下方日期標籤，查看當天的行程安排。
                </p>
            </div>

            <div class="flex overflow-x-auto hide-scrollbar space-x-3 pb-2" id="day-tabs-container"></div>

            <div id="itinerary-content" class="bg-white rounded-3xl shadow-sm border border-stone-100 p-6 sm:p-10 min-h-[450px]"></div>
        </section>

        <!-- 餐廳區塊 -->
        <section id="dining-section" class="space-y-6 pt-12 border-t border-stone-200">
            <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-stone-800 mb-2">🍽️ 美食地圖</h2>
                    <p class="text-stone-600">環境寬敞且無需行樓梯的餐廳。</p>
                </div>
                <div class="flex flex-wrap gap-2" id="dining-filters">
                    <button class="filter-btn active px-4 py-2 text-sm font-medium rounded-full bg-stone-800 text-white" data-filter="all">全部</button>
                    <button class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-stone-100 text-stone-600 hover:bg-stone-200" data-filter="新宿">新宿</button>
                    <button class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-stone-100 text-stone-600 hover:bg-stone-200" data-filter="銀座/晴空塔">銀座/晴空塔</button>
                    <button class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-stone-100 text-stone-600 hover:bg-stone-200" data-filter="富士河口湖">富士河口湖</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="dining-grid"></div>
        </section>

        <footer class="pt-16 pb-8 text-center text-stone-400 text-sm">
            <p>2026東京好玩之旅 🤩🤩 · 讓每人都開心的完美規劃</p>
        </footer>

    </main>

    <script>
        const itineraryData = [
            {
                day: 1,
                date: "6月4日",
                title: "抵達東京、輕鬆安頓",
                highlights: "✈️ 抵達 | 🚌 利木津巴士 | 🎣 釣船茶屋",
                hotel: { name: "新宿華盛頓酒店 本館", link: "https://maps.app.goo.gl/xxANPAMT2DPYCJGN8" },
                details: [
                    { time: "14:30", activity: "✈️抵達成田機場，辦理入境", note: "準備Visit Japan Web" },
                    { time: "15:00/16:00", activity: "乘搭利木津巴士", note: "直達酒店17:05/18:05到達酒店" },
                    { time: "17:30", activity: "入住新宿華盛頓酒店", note: "飯店位於都廳附近，交通便利" },
                    { time: "19:00", activity: "晚餐：釣船茶屋 (酒店1樓)", note: "在酒店內享受釣魚用餐樂趣" }
                ]
            },
            {
                day: 2,
                date: "6月5日",
                title: "叮噹博物館",
                highlights: "🤖 藤子·F·不二雄博物館 | 🗼 晴空塔",
                hotel: { name: "新宿華盛頓酒店 本館", link: "https://maps.app.goo.gl/xxANPAMT2DPYCJGN8" },
                details: [
                    { time: "08:00", activity: "酒店食早餐", note: "準備出發" },
                    { time: "09:15", activity: "新宿小田急線(往藤澤)", note: "去登戶" },
                    { time: "09:45", activity: "抵達登戶站(生地綠地口出)乘搭接駁巴士", note: "9:39, 9:50, 10:01, 10:12巴士" },
                    { time: "10:00", activity: "抵達🤖 藤子·F·不二雄博物館", note: "先到3樓餐廳拎飛Lunch" },
                    { time: "13:00", activity: "離開雄博物館前往東京晴空塔", note: "小田急線Google Map" },
                    { time: "15:00", activity: "前往東京晴空塔 (Skytree)", note: "建議搭乘半藏門線至押上站" },
                    { time: "18:30", activity: "晚餐：晴空塔商場 6F 鰻魚飯", note: "炭火香氣十足，軟嫩好消化" }
                ]
            },
            {
                day: 3,
                date: "6月6日",
                title: "自駕、古都鎌倉",
                highlights: "🚆 湘南新宿線 | 🚗 租車 | ⛩️ 鎌倉大佛",
                hotel: { name: "新宿華盛頓酒店 本館", link: "https://maps.app.goo.gl/xxANPAMT2DPYCJGN8" },
                details: [
                    { time: "08:00", activity: "酒店食早餐", note: "準備出發" },
                    { time: "09:00", activity: "新宿站乘搭 JR 湘南新宿線", note: "去船站" },
                    { time: "10:15", activity: "到大船站，去Toyota取車", note: "大船站東口" },
                    { time: "11:00", activity: "鎌倉高校前站，平交道", note: "男兒當入樽" },
                    { time: "14:00", activity: "鎌倉大佛與江之島", note: "自駕大幅減少走路時間" }
                ]
            },
            {
                day: 4,
                date: "6月7日",
                title: "河口湖",
                highlights: "🚂 富士回遊特急 | 🗻 大石公園",
                hotel: { name: "山田屋飯店", link: "https://maps.app.goo.gl/3MGtZBeHeKLt2cuM8" },
                details: [
                    { time: "08:00", activity: "酒店食早餐", note: "準備出發" },
                    { time: "09:02", activity: "新宿乘搭富士回遊", note: "直達河口湖" },
                    { time: "11:15", activity: "到河口湖", note: "食午餐" },
                    { time: "11:30", activity: "到河口湖，去Toyota取車", note: "欣賞富士山與花海" },
                    { time: "18:00", activity: "入住溫泉飯店享用晚餐", note: "看著富士山享用懷石料理" }
                ]
            },
            {
                day: 5,
                date: "6月8日",
                title: "富士美景、滿載而歸",
                highlights: "🛖 西湖 | 🚂 返回新宿",
                hotel: { name: "新宿華盛頓酒店 本館", link: "https://maps.app.goo.gl/xxANPAMT2DPYCJGN8" },
                details: [
                    { time: "10:00", activity: "西湖療癒之里根場", note: "體驗傳統合掌造建築" },
                    { time: "16:00", activity: "搭車返回新宿", note: "傍晚回到市區，回飯店取行李" }
                ]
            },
            {
                day: 6,
                date: "6月9日",
                title: "銀座美食、瘋狂Shopping",
                highlights: "🍜 花山烏冬 | 🛍️ 銀座 | 🥩 燒肉",
                hotel: { name: "新宿華盛頓酒店 本館", link: "https://maps.app.goo.gl/xxANPAMT2DPYCJGN8" },
                details: [
                    { time: "08:30", activity: "酒店食早餐", note: "準備出發" },
                    { time: "10:00", activity: "出發銀座花山烏冬", note: "JR，11:00前要到達" },
                    { time: "11:00", activity: "銀座花山烏冬", note: "寬麵條口感特殊，極受歡迎" },
                    { time: "14:00", activity: "銀座商場百貨購物", note: "銀座三越設有充足休息區" },
                    { time: "18:30", activity: "晚餐：六歌仙燒肉", note: "晚餐" }
                ]
            },
            {
                day: 7,
                date: "6月10日",
                title: "滿載而歸",
                highlights: "🚌 利木津巴士 | ✈️ 國泰航班",
                hotel: null,
                details: [
                    { time: "07:30", activity: "酒店食早餐", note: "食完回房準備離開" },
                    { time: "09:00", activity: "酒店Check-Out", note: "睇睇有冇漏低嘢" },
                    { time: "09:40", activity: "🚌 利木津巴士", note: "直達機場" },
                    { time: "12:07", activity: "到達成田機場", note: "Check-in後午餐" },
                    { time: "14:50", activity: "乘機CX527回港", note: "18:50到香港" }
                ]
            }
        ];

        const diningData = [
            { name: "釣船茶屋 ざうお", region: "新宿", desc: "位於飯店內，適合首晚抵達不想再出門的家庭。", link: "https://maps.app.goo.gl/57HMpDTANNa2P9KR7", icon: "🎣" },
            { name: "木曽路 新宿三丁目店", region: "新宿", desc: "傳統涮涮鍋，服務貼心，有電梯直達。", link: "https://maps.app.goo.gl/E8YQhK2yX8V7X7aB9", icon: "🍲" },
            { name: "名代豬排 かつくら", region: "新宿", desc: "高島屋百貨內，無障礙動線流暢。", link: "https://maps.app.goo.gl/i4ZsQAb7TWixBG2W6", icon: "🐷" },
            { name: "燒肉亭 六歌仙", region: "新宿", desc: "和牛吃到飽，地點絕佳，適合最後慶功宴。", link: "https://maps.app.goo.gl/BNsoju1kmxLWpSdd6", icon: "🥩" },
            { name: "名古屋備長鰻魚飯", region: "銀座/晴空塔", desc: "晴空塔內，不用日曬雨淋即可享用美食。", link: "https://maps.app.goo.gl/cYnnHVKXZCSP2eL76", icon: "🍱" },
            { name: "五代目 花山烏冬", region: "銀座/晴空塔", desc: "群馬縣名產，店內裝潢高雅舒適。", link: "https://maps.app.goo.gl/UtGgNg3P5LZxr4gM7", icon: "🍜" },
            { name: "山田屋飯店懷石", region: "富士河口湖", desc: "飯店一泊二食，邊看富士山邊用餐。", link: "https://maps.app.goo.gl/ud8U2Ncae6qdaWaP8", icon: "🍵" },
            { name: "拉麵 風雲兒", region: "新宿", desc: "人氣拉麵店，供應搭配各式醬料的沾麵，並設有吧台座位", link: "https://maps.app.goo.gl/bJYW1D9zzdugCFL6A", icon: "🍥" },
            { name: "豚珍館", region: "新宿", desc: "日式炸豬扒餐廳", link: "https://maps.app.goo.gl/MJu5iQV6MJHPmHd66", icon: "🐖" }
        ];

        function initChart() {
            const chartCanvas = document.getElementById('areaChart');
            if (!chartCanvas || typeof Chart === 'undefined') return;

            const ctx = chartCanvas.getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['東京市區', '富士/河口湖', '鎌倉'],
                    datasets: [{
                        data: [4, 2, 1],
                        backgroundColor: ['#0d9488', '#f59e0b', '#3b82f6'],
                        hoverOffset: 15,
                        borderRadius: 10,
                        borderWidth: 5,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        window.onload = function() {
            initChart();
            
            const tabsContainer = document.getElementById('day-tabs-container');
            const contentContainer = document.getElementById('itinerary-content');

            function renderItinerary(dayIndex) {
                const day = itineraryData[dayIndex];
                document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                    idx === dayIndex ? btn.classList.add('active') : btn.classList.remove('active');
                });

                let detailsHTML = day.details.map(d => `
                    <div class="flex gap-6 border-b border-stone-100 last:border-0 pb-6 mb-6 last:mb-0 last:pb-0 fade-in">
                        <div class="flex-shrink-0">
                            <span class="inline-block px-3 py-1 bg-teal-50 text-teal-700 rounded-full font-bold text-sm">${d.time}</span>
                        </div>
                        <div>
                            <p class="text-stone-800 font-bold text-lg mb-2">${d.activity}</p>
                            <p class="text-stone-500 text-sm bg-stone-50 p-3 rounded-2xl border border-dashed border-stone-200">✨ 備註：${d.note}</p>
                        </div>
                    </div>
                `).join('');

                contentContainer.innerHTML = `
                    <div class="fade-in">
                        <div class="mb-8 border-l-4 border-teal-600 pl-4">
                            <span class="text-teal-600 font-bold text-sm tracking-widest uppercase">${day.date}</span>
                            <h3 class="text-3xl font-black text-stone-800 mt-1">${day.title}</h3>
                            <div class="flex flex-wrap gap-2 mt-3">
                                ${day.highlights.split('|').map(h => `<span class="bg-stone-100 text-stone-600 px-3 py-1 rounded-full text-xs font-medium">${h.trim()}</span>`).join('')}
                            </div>
                        </div>
                        <div class="space-y-2">
                            ${detailsHTML}
                        </div>
                        ${day.hotel ? `
                            <div class="mt-10 p-6 bg-stone-900 text-white rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4">
                                <div class="flex items-center gap-4">
                                    <div class="text-3xl">🏨</div>
                                    <div>
                                        <p class="text-xs text-stone-400 font-bold uppercase tracking-widest">住宿安排</p>
                                        <p class="text-lg font-bold">${day.hotel.name}</p>
                                    </div>
                                </div>
                                <a href="${day.hotel.link}" target="_blank" class="w-full sm:w-auto px-8 py-3 bg-teal-500 hover:bg-teal-400 text-white font-bold rounded-2xl transition-all shadow-lg shadow-teal-500/20 text-center">地圖導航</a>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            itineraryData.forEach((day, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn flex-shrink-0 px-6 py-4 rounded-2xl border-2 font-bold transition-all duration-200 bg-white text-stone-400 border-stone-100 hover:border-teal-100`;
                btn.innerHTML = `<span class="block text-[10px] uppercase tracking-tighter opacity-60">Day ${day.day}</span><span class="text-sm">${day.date}</span>`;
                btn.onclick = () => renderItinerary(index);
                tabsContainer.appendChild(btn);
            });

            renderItinerary(0); 

            const diningGrid = document.getElementById('dining-grid');
            const filterBtns = document.querySelectorAll('.filter-btn');

            function renderDining(filterText) {
                diningGrid.innerHTML = '';
                const filtered = filterText === 'all' ? diningData : diningData.filter(d => d.region === filterText);
                filtered.forEach(d => {
                    diningGrid.innerHTML += `
                        <div class="bg-white rounded-3xl p-6 border border-stone-100 shadow-sm illus-card flex flex-col h-full fade-in">
                            <div class="flex items-center justify-between mb-4">
                                <div class="w-12 h-12 bg-stone-50 rounded-2xl flex items-center justify-center text-2xl">${d.icon}</div>
                                <span class="text-[10px] font-black text-stone-400 bg-stone-50 px-3 py-1 rounded-full uppercase tracking-widest">${d.region}</span>
                            </div>
                            <h4 class="text-xl font-bold text-stone-800 mb-2">${d.name}</h4>
                            <p class="text-sm text-stone-500 mb-6 leading-relaxed flex-grow">${d.desc}</p>
                            <a href="${d.link}" target="_blank" class="w-full py-3 bg-stone-100 text-stone-800 rounded-2xl text-sm font-bold hover:bg-teal-600 hover:text-white transition-all text-center">查看 Google Map</a>
                        </div>
                    `;
                });
            }

            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    filterBtns.forEach(b => {
                        b.classList.remove('active', 'bg-stone-800', 'text-white');
                        b.classList.add('bg-stone-100', 'text-stone-600');
                    });
                    e.target.classList.remove('bg-stone-100', 'text-stone-600');
                    e.target.classList.add('active', 'bg-stone-800', 'text-white');
                    renderDining(e.target.dataset.filter);
                });
            });

            renderDining('all');
        };
    </script>
</body>
</html>
